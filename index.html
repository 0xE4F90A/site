<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0f19" />
  <title>レヲン's</title>
  <link rel="stylesheet" href="stylesheet.css" />
  <script src="script.js" defer></script>
</head>

<body>
  <header class="header">
    <div class="header__inner">
      <button class="brand" id="brandBtn" type="button" aria-label="トップへ">
        <span class="brand__mark">›</span>
        <span class="brand__text">Hello.</span>
      </button>

      <nav class="nav" aria-label="メインメニュー">
        <a class="nav__link" href="info.html" target="_blank" rel="noreferrer">綾鷹</a>
        <a class="nav__link" href="questions.html" target="_blank" rel="noreferrer">Quiz</a>
        <a class="nav__link" href="#sites">便利サイト</a>

        <div class="nav__actions">
          <button class="btn btn--ghost" id="loginOpen" type="button">ログイン</button>
          <button class="btn btn--primary" id="signupOpen" type="button">新規登録</button>
        </div>
      </nav>

      <button class="burger" id="burgerBtn" type="button" aria-label="メニュー" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>

    <div class="mobileNav" id="mobileNav" aria-hidden="true">
      <a class="mobileNav__link" href="info.html" target="_blank" rel="noreferrer">綾鷹</a>
      <a class="mobileNav__link" href="questions.html" target="_blank" rel="noreferrer">Quiz</a>
      <a class="mobileNav__link" href="#sites">便利サイト</a>
      <div class="mobileNav__actions">
        <button class="btn btn--ghost" id="loginOpen_m" type="button">ログイン</button>
        <button class="btn btn--primary" id="signupOpen_m" type="button">新規登録</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero__bg" aria-hidden="true"></div>
      <div class="container hero__inner">
        <div class="hero__badge">Utility Collection</div>
        <h1 class="hero__title">便利サイトを、気持ちよく。</h1>
        <p class="hero__lead">
          よく使うサイトをカードで整理。検索・お気に入りもサクッと。
        </p>

        <div class="hero__controls">
          <label class="search" aria-label="サイト検索">
            <span class="search__icon" aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="サイト名 / キーワードで検索" autocomplete="off" />
          </label>

          <div class="toggleRow">
            <label class="toggle">
              <input id="onlyFav" type="checkbox" />
              <span>お気に入りのみ</span>
            </label>
          </div>
        </div>
      </div>
    </section>

    <section id="sites" class="section">
      <div class="container">
        <div class="section__head">
          <h2 class="section__title">よく使うサイト</h2>
          <p class="section__sub">カードをクリックで説明を開閉。★でお気に入り登録。</p>
        </div>

        <div class="grid" id="frequentGrid" aria-live="polite"></div>

        <div class="divider"></div>

        <div class="section__head">
          <h2 class="section__title">その他のサイト</h2>
          <p class="section__sub">軽量なリンク集（分類ごと）。</p>
        </div>

        <div class="pillGroups" id="otherGroups" aria-live="polite"></div>
      </div>
    </section>

    <footer class="footer">
      <div class="container footer__inner">
        <span class="footer__text">© Utility Collection</span>
        <a class="footer__top" href="#" id="toTop">Top</a>
      </div>
    </footer>
  </main>

  <!-- Login Modal -->
  <dialog class="dialog" id="loginDialog" aria-label="ログインフォーム">
    <form method="dialog" class="dialog__panel">
      <div class="dialog__head">
        <h3>ログイン</h3>
        <button class="iconBtn" value="cancel" aria-label="閉じる" type="submit">×</button>
      </div>

      <div class="dialog__body">
        <label class="field">
          <span>ID</span>
          <input id="loginId" type="text" placeholder="ID" autocomplete="username" />
        </label>
        <label class="field">
          <span>パスワード</span>
          <input id="loginPass" type="password" placeholder="パスワード" autocomplete="current-password" />
        </label>

        <p class="hint">
          ※デモUIです。パスワードをURLに含める等は危険なので行いません。
        </p>
      </div>

      <div class="dialog__foot">
        <button class="btn btn--ghost" value="cancel" type="submit">キャンセル</button>
        <button class="btn btn--primary" id="loginBtn" type="button">ログイン</button>
      </div>
    </form>
  </dialog>

  <!-- Signup Modal -->
  <dialog class="dialog" id="signupDialog" aria-label="新規登録フォーム">
    <form method="dialog" class="dialog__panel">
      <div class="dialog__head">
        <h3>新規登録</h3>
        <button class="iconBtn" value="cancel" aria-label="閉じる" type="submit">×</button>
      </div>

      <div class="dialog__body">
        <label class="field">
          <span>メールアドレス</span>
          <input id="signupEmail" type="email" placeholder="mail@example.com" autocomplete="email" />
        </label>
        <label class="field">
          <span>パスワード</span>
          <input id="signupPass" type="password" placeholder="パスワード" autocomplete="new-password" />
        </label>
      </div>

      <div class="dialog__foot">
        <button class="btn btn--ghost" value="cancel" type="submit">キャンセル</button>
        <button class="btn btn--primary" id="signupBtn" type="button">登録</button>
      </div>
    </form>
  </dialog>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
